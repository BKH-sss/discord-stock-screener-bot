name: Daily 9AM Stock News Notification

on:
  schedule:
    # 매일 한국 시간 아침 9시 (09:00 KST = UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 테스트 실행 버튼

jobs:
  stock_news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock News Bot
        env:
          KR_DISCORD_WEBHOOK_URL: ${{ secrets.KR_DISCORD_WEBHOOK_URL }}
          US_DISCORD_WEBHOOK_URL: ${{ secrets.US_DISCORD_WEBHOOK_URL }}
        run: |
          python stock_news_bot.py
