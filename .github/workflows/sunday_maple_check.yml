name: Sunday Maple Discord Notification

on:
  schedule:
    # 넥슨 메이플스토리 공식 이벤트 공지 등록 후 오전 10시 05분(KST)에 실행
    # (한국 시간 10:05 KST = UTC 01:05)
    - cron: '5 1 * * *'
  workflow_dispatch: # 수동 테스트 실행 버튼

jobs:
  check_maple:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sunday Maple Bot
        env:
          MAPLE_DISCORD_WEBHOOK_URL: ${{ secrets.MAPLE_DISCORD_WEBHOOK_URL }}
        run: |
          python sunday_maple_bot.py
