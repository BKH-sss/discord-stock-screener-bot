name: Sunday Maple Discord Notification

on:
  schedule:
    # 썬데이 메이플 공지가 올라오는 매주 금요일(KST 09:00 ~ 20:00)에 2시간마다 확인
    # KST 금요일 09:00~20:00 -> UTC 금요일 00:00~11:00 (5 = 금요일)
    - cron: '0 0-11/2 * * 5'
  workflow_dispatch: # 수동 테스트 실행 버튼 (GitHub 웹에서 즉시 실행)
    inputs:
      force_send:
        description: '요일 제한 무시하고 즉시 강제 전송 여부 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  check_maple:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sunday Maple Bot
        env:
          MAPLE_DISCORD_WEBHOOK_URL: ${{ secrets.MAPLE_DISCORD_WEBHOOK_URL }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: |
          python sunday_maple_bot.py

      - name: Commit and push if last_sunday_maple.txt changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sunday_maple.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update last_sunday_maple.txt [skip ci]" && git push)
