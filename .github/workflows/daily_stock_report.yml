name: Daily KR & US Stock Discord Report

on:
  schedule:
    # 매일 한국 시간 아침 7시 48분 (KST = UTC+9) -> UTC 22:48
    - cron: '48 22 * * *'
  workflow_dispatch: # GitHub 웹에서 [Run workflow] 버튼으로 즉시 테스트 실행 가능

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Korea Stock Bot
        env:
          KR_DISCORD_WEBHOOK_URL: ${{ secrets.KR_DISCORD_WEBHOOK_URL }}
        run: |
          python korea_stock_bot.py

      - name: Run US Stock Bot
        env:
          US_DISCORD_WEBHOOK_URL: ${{ secrets.US_DISCORD_WEBHOOK_URL }}
        run: |
          python stock_bot.py
